name: Document core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned toolchain
        run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run --locked -p living-source-core --example demo
      - name: Persistent demo first run
        run: cargo run --locked -p living-source-core --example persistent_demo -- "${{ runner.temp }}/living-source-smoke.sqlite"
      - name: Persistent demo reopen
        run: cargo run --locked -p living-source-core --example persistent_demo -- "${{ runner.temp }}/living-source-smoke.sqlite"
      - run: cargo run --locked -p living-source-core --example schemas
      - name: Check generated schemas are current
        run: git diff --exit-code -- schemas
